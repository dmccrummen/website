<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <meta name="theme-color" content="#0B0B0C">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-64.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="" width="40" height="40">
      <span>Daniel McCrummen</span>
    </a>
    <nav aria-label="Main">
      <a href="{{ '/#reel' | relative_url }}">Reel</a>
      <a href="{{ '/#tools' | relative_url }}">Tools</a>
      <a href="{{ site.data.site.resume | relative_url }}" target="_blank" rel="noopener">Resume</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer wrap">
    <span>&copy; {{ 'now' | date: '%Y' }} Daniel McCrummen</span>
    <span class="footer-links">
      {% for link in site.data.site.links %}
      <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a>
      {% endfor %}
    </span>
  </footer>
</body>
</html>
