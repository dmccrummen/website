<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172225" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

<title>My Checkbook</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checkbook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-column register like a paper check ledger; sticky balance header, newest-first list with running balance, floating add button */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#15232A; --muted:#5B6D70; --line:#D5DDDA;
  --accent:#1E6B59; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --debit:#9E3A2F; --credit:#1E6B59; --stripe:#E6EFEB; --warn-bg:#FBF0E2; --warn:#7F4612; --scrim:rgba(12,22,26,.45);
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172225; --ink:#E4ECEA; --muted:#93A6A6; --line:#2A383B;
  --accent:#5CB79C; --accent-ink:#0B1A16; --accent-soft:#1D3530; --stripe:#1D2B2E;
  --debit:#E58A7C; --credit:#6BC7AA; --warn-bg:#33281A; --warn:#F0C48E; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172225; --ink:#E4ECEA; --muted:#93A6A6; --line:#2A383B;
  --accent:#5CB79C; --accent-ink:#0B1A16; --accent-soft:#1D3530; --stripe:#1D2B2E;
  --debit:#E58A7C; --credit:#6BC7AA; --warn-bg:#33281A; --warn:#F0C48E; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.app{max-width:640px;margin:0 auto;padding-bottom:110px}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}
.acct-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;font-weight:600;font-size:15px;color:var(--muted)}
.acct-btn svg{width:14px;height:14px}
.bal-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bal{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;letter-spacing:-.02em}
.bal.neg{color:var(--debit)}
.sub{font-size:13px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.sub b{font-weight:600;color:var(--ink);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.stat{display:grid;gap:2px;align-content:start;min-width:0}
.stat b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(14px,4.4vw,19px);font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.neg{color:var(--debit)}
.stat small{font-size:12px;color:var(--muted)}
.stat.main-stat{text-align:right}
.stat.main-stat b{font-size:clamp(17px,5.4vw,24px)}
.stat:nth-child(2){text-align:center}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500}
.chip.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.45}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.selbar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);min-width:0}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.banner{margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{background:none;border:1px solid currentColor;border-radius:999px;padding:4px 10px;color:inherit;font-size:13px;font-weight:600}

.list{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.month{display:flex;justify-content:space-between;padding:18px 2px 6px}
.row{display:grid;grid-template-columns:auto 44px minmax(0,1fr) auto auto;align-items:center;gap:10px;background:var(--surface);
  border-bottom:1px solid var(--line);padding:10px 10px;cursor:pointer;user-select:none}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--surface)}
.month + .sw{border-radius:10px 10px 0 0}
.sw.last{border-radius:0 0 10px 10px;border-bottom:0}
.month + .sw.last{border-radius:10px}
.sw .row{border-bottom:0;position:relative;z-index:1;transition:transform .22s ease;touch-action:pan-y}
.sw .row.dragging{transition:none}
.sw-del{position:absolute;top:0;right:0;bottom:0;width:100%;border:0;background:var(--debit);color:var(--surface);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:22px}
.box{width:0;overflow:hidden;transition:width .15s}
.selecting .box{width:22px}
.box span{display:block;width:20px;height:20px;border-radius:6px;border:2px solid var(--line)}
.striped .row.alt{background:var(--stripe)}
.row.is-sel,.striped .row.is-sel{background:var(--accent-soft)}
.row.is-sel .box span{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-soft)}
.d{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.d .mon{font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.d .day{font-family:var(--f-num);font-size:18px;font-weight:500}
.main{min-width:0}
.payee{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums{text-align:right}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.amt.debit{color:var(--debit)} .amt.credit{color:var(--credit)}
.rb{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.clr{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:none;font-family:var(--f-num);font-size:12px;font-weight:600;color:var(--muted)}
.clr.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selecting .clr{visibility:hidden}
.opening{width:100%;background:none;font:inherit;text-align:left;cursor:pointer;gap:10px;flex-wrap:wrap}
.opening .edit{color:var(--accent);font-family:var(--f-body);font-weight:600;margin-left:6px}
.opening{display:flex;justify-content:space-between;padding:12px 10px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;margin-top:14px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;
  background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.actbar{flex-wrap:wrap}
.upcoming{margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:grid;gap:6px}
.up-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
.up-item .when{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.up-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.gear{display:inline-flex;align-items:center;gap:6px}
.chip.gear svg{width:16px;height:16px}
.set-item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.set-item .chev{color:var(--muted);font-size:20px}
.chip.sm{padding:5px 10px;font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.rep-tag{font-size:11px;color:var(--muted);margin-left:4px}
.banner .acts{display:flex;gap:8px}
.actbar .info{font-size:14px;min-width:0}
.act-btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.btn.sm{padding:9px 12px;font-size:14px}
.sugg{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-top:4px}
.sugg-item{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.sugg-item:last-child{border-bottom:0}
.sugg-item .pick{flex:1;min-width:0;border:0;background:none;text-align:left;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:15px}
.sugg-item .pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg-item .pick small{color:var(--muted);font-size:12.5px;flex:none}
.sugg-item .forget{border:0;background:none;color:var(--muted);width:40px;align-self:stretch;font-size:18px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--debit);color:var(--surface)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{margin:0 0 4px;font-size:20px;text-wrap:balance}
.sheet p{margin:6px 0;color:var(--muted);font-size:14px}
.fields{display:grid;gap:12px;margin-top:14px}
.field{display:grid;gap:4px}
.field label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%;min-width:0;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:10px;font-weight:600}
.seg button.on.out{background:var(--debit);color:var(--surface)}
.seg button.on.in{background:var(--credit);color:var(--surface)}
.seg.two-way{grid-template-columns:1fr 1fr}
.seg button.on.xf{background:var(--accent);color:var(--accent-ink)}
.xf-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.xf-row .arrow{padding-bottom:10px;color:var(--muted);font-size:18px}
.xf-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent);margin-right:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check small{display:block;color:var(--muted);font-size:13px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sheet-actions .spacer{flex:1}
.preview{background:var(--bg);border-radius:10px;padding:12px;margin-top:12px;display:grid;gap:6px;font-size:14px}
.preview div{display:flex;justify-content:space-between;gap:10px}
.preview b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.acct-list{display:grid;gap:8px;margin-top:12px}
.acct-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:none;text-align:left;width:100%}
.acct-item.on{border-color:var(--accent);background:var(--accent-soft)}
textarea.csv{font-family:var(--f-num);font-size:12px;min-height:120px;resize:vertical}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.msg{font-size:14px;color:var(--accent);min-height:1.2em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;padding:4px 6px}
@media (prefers-reduced-motion: reduce){.box,.sw .row{transition:none}}

/* ---------- Themes (each follows the phone's light/dark setting, except Midnight) ---------- */
@media (prefers-color-scheme: dark){
@media (prefers-color-scheme: dark){
:root[data-palette="slate"]{--bg:#EFF0F2;--line:#D8DBE0;--muted:#636A74;--accent:#38424E;--accent-ink:#FFFFFF;--accent-soft:#E0E3E8;--stripe:#ECEEF1;--credit:#2C6B4F}
@media (prefers-color-scheme: dark){:root[data-palette="slate"]:not([data-theme="light"]){--bg:#111316;--surface:#1A1D21;--line:#2D3238;--muted:#9AA1AB;--accent:#C3CBD5;--accent-ink:#14171B;--accent-soft:#2A2F36;--stripe:#22262B;--credit:#78C7A2}}
:root[data-palette="slate"][data-theme="dark"]{--bg:#111316;--surface:#1A1D21;--line:#2D3238;--muted:#9AA1AB;--accent:#C3CBD5;--accent-ink:#14171B;--accent-soft:#2A2F36;--stripe:#22262B;--credit:#78C7A2}

@media (prefers-color-scheme: dark){
html:root[data-palette="midnight"]{--bg:#0A0D13;--surface:#131824;--ink:#E7EBF3;--muted:#8B94A8;--line:#252C3B;--accent:#F2B24C;--accent-ink:#1C1406;
  --accent-soft:#2D2616;--stripe:#1A2030;--debit:#FF8F7D;--credit:#7DD8AA;--warn-bg:#2E2516;--warn:#F4CB8A;--scrim:rgba(0,0,0,.65);color-scheme:dark}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.swatch{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);text-align:left;display:grid;gap:8px}
.swatch.on{border-color:var(--accent)}
.swatch .dots{display:flex;gap:4px}
.swatch .dots i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(127,127,127,.35)}
.swatch b{font-size:14px}
.swatch small{color:var(--muted);font-size:12px}
</style>

</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>

<script>
(function(){
const KEY='my-checkbook-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const money=c=>fmt.format(c/100);
const plain=c=>(c<0?'−':'+')+(Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const longDate=s=>{const[y,m,d]=s.split('-').map(Number);return MONTHS[m-1].slice(0,3)+' '+d+', '+y};

let S, ui={stripes:true,select:false,sel:new Set(),undo:null,toastTimer:null,sheet:null};

function sampleState(){
  const a='ex1', t=[];
  let seq=0;
  const add=(date,payee,amt,cat,cleared,note)=>t.push({id:uid(),acct:a,date,payee,amount:Math.round(amt*100),cat,cleared,note:note||'',seq:++seq});
  add('2026-10-01','Paycheck',1840,'Income',true);
  add('2026-10-03','Rent',-1150,'Housing',true);
  add('2026-10-06','H-E-B',-86.42,'Groceries',true);
  add('2026-10-10','City Utilities',-112.30,'Utilities',true);
  add('2026-10-15','Paycheck',1840,'Income',true);
  add('2026-10-18','Shell',-41.75,'Gas',true);
  add('2026-10-24','Check #1042',-60,'Gifts',false,'Birthday card for Mom');
  add('2026-11-01','Paycheck',1840,'Income',true);
  add('2026-11-02','Rent',-1150,'Housing',false);
  add('2026-11-04','H-E-B',-92.18,'Groceries',false);
  add('2026-11-05','Netflix',-15.49,'Subscriptions',false);
  const v='ex2';
  const addV=(date,payee,amt,cat,cleared)=>t.push({id:uid(),acct:v,date,payee,amount:Math.round(amt*100),cat,cleared,note:'',seq:++seq});
  const xfer=(date,amt,cleared,note)=>{const link=uid();
    t.push({id:uid(),acct:a,date,payee:'',amount:-Math.round(amt*100),cat:'Transfer',cleared,note,seq:++seq,xfer:{link,other:v}});
    t.push({id:uid(),acct:v,date,payee:'',amount:Math.round(amt*100),cat:'Transfer',cleared,note,seq:++seq,xfer:{link,other:a}})};
  addV('2026-10-12','Amazon',-64.99,'Shopping',true);
  addV('2026-10-20','Chick-fil-A',-18.42,'Dining',true);
  xfer('2026-10-29',300,true,'Card payment');
  xfer('2026-11-01',400,false,'November card budget');
  addV('2026-11-03','Target',-52.10,'Shopping',false);
  const rRent='exr1',rNet='exr2';
  t.filter(x=>x.payee==='Rent').forEach(x=>x.rule=rRent); t.filter(x=>x.payee==='Netflix').forEach(x=>x.rule=rNet);
  var recurring=[{id:rRent,kind:'out',acct:a,to:'',amount:115000,payee:'Rent',cat:'Housing',note:'',freq:'monthly',day:2,next:'2026-12-02'},
    {id:rNet,kind:'out',acct:a,to:'',amount:1549,payee:'Netflix',cat:'Subscriptions',note:'',freq:'monthly',day:5,next:'2026-12-05'}];
  return {v:1,sample:true,seq,current:a,accounts:[{id:a,name:'Checking',opening:125000,openingDate:'2026-10-01'},{id:v,name:'Visa',opening:-42000,openingDate:'2026-10-01'}],txns:t,recurring};
}
function blankState(){const a=uid();return {v:1,sample:false,seq:0,current:a,accounts:[{id:a,name:'Checking',opening:0,openingDate:today()}],txns:[]}}
const FREQ={weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly',quarterly:'Every 3 months',yearly:'Yearly'};
function addPeriod(d,f,day){
  const[y,m,dd]=d.split('-').map(Number);
  if(f==='weekly'||f==='biweekly')return new Date(Date.UTC(y,m-1,dd+(f==='weekly'?7:14))).toISOString().slice(0,10);
  const k={monthly:1,quarterly:3,yearly:12}[f]||1; let mm=m-1+k; const yy=y+Math.floor(mm/12); mm%=12;
  const last=new Date(Date.UTC(yy,mm+1,0)).getUTCDate(); return yy+'-'+pad(mm+1)+'-'+pad(Math.min(day||dd,last));
}
const ruleOf=t=>t&&t.rule?(S.recurring||[]).find(r=>r.id===t.rule):null;
const ruleName=r=>r.kind==='xf'?'Transfer to '+acctName(r.to):(r.payee||'No payee');
function postRule(r,date){
  if(r.kind==='xf'){const link=uid();
    S.txns.push({id:uid(),acct:r.acct,seq:++S.seq,date,payee:'',amount:-r.amount,cat:'Transfer',cleared:false,note:r.note||'',xfer:{link,other:r.to},rule:r.id});
    S.txns.push({id:uid(),acct:r.to,seq:++S.seq,date,payee:'',amount:r.amount,cat:'Transfer',cleared:false,note:r.note||'',xfer:{link,other:r.acct},rule:r.id});
  }else{const t={id:uid(),acct:r.acct,seq:++S.seq,date,payee:r.payee||'',amount:r.kind==='out'?-r.amount:r.amount,cat:r.cat||'',cleared:false,note:r.note||'',rule:r.id};S.txns.push(t);remember(t)}
}
function generateDue(){
  S.recurring=(S.recurring||[]).filter(r=>S.accounts.some(a=>a.id===r.acct)&&(r.kind!=='xf'||S.accounts.some(a=>a.id===r.to)));
  let n=0; const td=today();
  for(const r of S.recurring){let g=0;while(r.next<=td&&g++<500){postRule(r,r.next);r.next=addPeriod(r.next,r.freq,r.day);n++}}
  return n;
}
function syncRule(t,freq,f){
  S.recurring=S.recurring||[]; let r=ruleOf(t);
  if(freq==='never'){if(r)S.recurring=S.recurring.filter(x=>x!==r);return}
  const fields={kind:f.mode,acct:f.mode==='xf'?f.from:t.acct,to:f.mode==='xf'?f.to:'',amount:f.amt,payee:f.mode==='xf'?'':f.payee,cat:f.mode==='xf'?'Transfer':f.cat,note:f.note,freq};
  if(r){const changed=r.freq!==freq;Object.assign(r,fields);if(changed){r.next=addPeriod(t.date,freq,r.day);while(r.next<=t.date)r.next=addPeriod(r.next,freq,r.day)}}
  else{const day=+t.date.slice(8);r={id:uid(),...fields,day,next:addPeriod(t.date,freq,day)};S.recurring.push(r);t.rule=r.id;const p=partnerOf(t);if(p)p.rule=r.id}
}
/* money fields fill from the right like a register: 1-2-3-4 → 12.34 */
function fmtDigits(d){d=String(d).replace(/\D/g,'').replace(/^0+/,'');if(!d)return '';const n=d.padStart(3,'0');return (+n.slice(0,-2)).toLocaleString('en-US')+'.'+n.slice(-2)}
function fmtMoneyInput(v){if(v===''||v==null)return '';const c=Math.round(Math.abs(parseFloat(v))*100);return c?fmtDigits(String(c)):''}
function caretEnd(el){const n=el.value.length;try{el.setSelectionRange(n,n)}catch(e){}}
function remember(t){
  if(!t||t.xfer||!t.payee)return; S.payees=S.payees||{};
  const k=t.payee.trim().toLowerCase(); if(!k)return;
  const o=S.payees[k]; S.payees[k]={name:t.payee.trim(),cat:t.cat||(o&&o.cat)||'',out:t.amount<0,n:((o&&o.n)||0)+1,last:t.date>((o&&o.last)||'')?t.date:o.last};
}
function ensurePayees(){if(!S.payees){S.payees={};S.txns.slice().sort(byDate).forEach(remember)}}
function payeeMatches(q){
  q=q.trim().toLowerCase();
  return Object.entries(S.payees||{}).filter(([k])=>k!==q&&(!q||k.includes(q)))
    .sort((a,b)=>(q?(b[0].startsWith(q)-a[0].startsWith(q)):0)||b[1].n-a[1].n||(b[1].last>a[1].last?1:-1)).slice(0,6);
}
function showSugg(){
  const box=$('#payeeSugg'),inp=$('#fPayee'); if(!box||!inp)return;
  const m=payeeMatches(inp.value);
  if(!m.length||document.activeElement!==inp){box.hidden=true;return}
  box.innerHTML=m.map(([k,p])=>`<div class="sugg-item"><button type="button" class="pick" data-act="pickPayee" data-k="${esc(k)}"><span>${esc(p.name)}</span>${p.cat?`<small>${esc(p.cat)}</small>`:''}</button><button type="button" class="forget" data-act="forgetPayee" data-k="${esc(k)}" aria-label="Forget ${esc(p.name)}">×</button></div>`).join('');
  box.hidden=false;
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.accounts&&p.accounts.length){S=(p.sample&&!p.accounts.some(x=>x.id==='ex2'))?sampleState():p;return}}}catch(e){} S=sampleState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const acct=()=>S.accounts.find(a=>a.id===S.current)||S.accounts[0];
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:a.seq-b.seq;
const txnsOf=id=>S.txns.filter(t=>t.acct===id).sort(byDate);
const partnerOf=t=>t&&t.xfer?S.txns.find(x=>x!==t&&x.xfer&&x.xfer.link===t.xfer.link):null;
const acctName=id=>{const x=S.accounts.find(a=>a.id===id);return x?x.name:'another account'};
function label(t){if(!t.xfer)return t.payee;const p=partnerOf(t);const other=acctName(p?p.acct:t.xfer.other);return (t.amount<0?'Transfer to ':'Transfer from ')+other}
function totals(a){let bal=a.opening,clr=a.opening,pend=0;for(const t of S.txns){if(t.acct!==a.id)continue;bal+=t.amount;if(t.cleared)clr+=t.amount;else pend++}return{bal,clr,pend}}

/* ---------- main render ---------- */
function render(){
  const a=acct(); if(!a){S=blankState();return render()}
  const {bal,clr,pend}=totals(a);
  const list=txnsOf(a.id);
  let run=a.opening; const withBal=list.map(t=>(run+=t.amount,{...t,bal:run})).reverse();
  let rows='', lastKey='', idx=0;
  withBal.forEach((t,i)=>{
    const key=t.date.slice(0,7);
    if(key!==lastKey){
      const[y,m]=key.split('-').map(Number);
      const monthTotal=withBal.filter(x=>x.date.slice(0,7)===key).reduce((s,x)=>s+x.amount,0);
      rows+=`<div class="month"><span class="lbl">${MONTHS[m-1]} ${y}</span><span class="lbl num">${plain(monthTotal)}</span></div>`;
      lastKey=key; idx=0;
    }
    const next=withBal[i+1]; const last=!next||next.date.slice(0,7)!==key;
    const[,mm,dd]=t.date.split('-');
    const meta=[t.xfer?'':t.cat,t.note].filter(Boolean).map(esc).join(' · ');
    const name=label(t);
    rows+=`<div class="sw${last?' last':''}"><button class="sw-del" data-act="swdel" data-id="${t.id}" tabindex="-1">Delete</button><div class="row${(idx++)%2?' alt':''}${ui.sel.has(t.id)?' is-sel':''}" role="button" tabindex="0" data-act="row" data-id="${t.id}">
      <div class="box"><span></span></div>
      <div class="d"><span class="mon">${MON[+mm-1]}</span><span class="day">${dd}</span></div>
      <div class="main"><div class="payee">${t.xfer?'<span class="xf-tag">⇄</span>':''}${esc(name)||'<span style="color:var(--muted)">No payee</span>'}${t.rule&&(S.recurring||[]).some(r=>r.id===t.rule)?'<span class="rep-tag" title="Repeats">↻</span>':''}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>
      <div class="nums"><div class="amt ${t.amount<0?'debit':'credit'}">${plain(t.amount)}</div><div class="rb">${(t.bal/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
      <button class="clr${t.cleared?' on':''}" data-act="clear" data-id="${t.id}" aria-label="${t.cleared?'Mark not cleared':'Mark cleared'}" title="Cleared">C</button>
    </div></div>`;
  });
  const opening=`<button class="opening" data-act="opening"><span>Opening balance · ${longDate(a.openingDate)}</span><span class="num">${money(a.opening)} <span class="edit">Edit</span></span></button>`;

  const tools=ui.select?`
    <div class="selbar">
      <button class="chip primary" data-act="done">Done</button>
      <button class="chip" data-act="all">${ui.sel.size===list.length&&list.length?'Select none':'Select all'}</button>
      <button class="chip" data-act="selcleared">Cleared only</button>
    </div>
    <div class="selbar">
      <label class="lbl" for="beforeDate">Before</label>
      <input type="date" id="beforeDate" value="${firstOfMonth()}">
      <button class="chip" data-act="selbefore">Select</button>
    </div>`:`
    <div class="tools">
      <button class="chip" data-act="select" ${list.length?'':'disabled'}>Select</button>
      <button class="chip" data-act="statement" ${list.length?'':'disabled'}>New statement</button>
      <button class="chip" data-act="repeating">Repeating</button>
      <button class="chip gear" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</button>
    </div>`;

  $('#app').innerHTML=`
    <header class="head">
      <button class="acct-btn" data-act="accounts">${esc(a.name)}<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg></button>
      <div class="stats">
        <div class="stat"><span class="lbl">Cleared</span><b class="${clr<0?'neg':''}">${money(clr)}</b></div>
        <div class="stat"><span class="lbl">Outstanding</span><b class="${bal-clr<0?'neg':''}">${money(bal-clr)}</b><small>${pend} item${pend===1?'':'s'}</small></div>
        <div class="stat main-stat"><span class="lbl">Balance</span><b class="${bal<0?'neg':''}">${money(bal)}</b></div>
      </div>
      ${tools}
    </header>
    ${backupBanner()}
    ${upcoming(a)}
    ${S.sample?`<div class="banner"><span>These are example transactions so you can try things out.</span><button data-act="clearSample">Start fresh</button></div>`:''}
    <div class="list${ui.select?' selecting':''}${ui.stripes?' striped':''}">${rows||'<div class="empty">No transactions yet. Tap + to add one.</div>'}${opening}</div>`;

  let bar=$('#actbar'), fab=$('#fab');
  if(bar)bar.remove(); if(fab)fab.remove();
  if(ui.select){
    const sum=[...ui.sel].reduce((s,id)=>{const t=S.txns.find(x=>x.id===id);return s+(t?t.amount:0)},0);
    document.body.insertAdjacentHTML('beforeend',`<div class="actbar" id="actbar"><div class="info"><b>${ui.sel.size}</b> selected${ui.sel.size?` · <span class="num">${plain(sum)}</span>`:''}</div><div class="act-btns"><button class="btn ghost sm" data-act="markclr" data-v="1" ${ui.sel.size?'':'disabled'}>Mark cleared</button><button class="btn ghost sm" data-act="markclr" data-v="0" ${ui.sel.size?'':'disabled'}>Uncleared</button><button class="btn danger sm" data-act="askdelete" ${ui.sel.size?'':'disabled'}>Delete</button></div></div>`);
  }else{
    document.body.insertAdjacentHTML('beforeend',`<button class="fab" id="fab" data-act="add" aria-label="Add transaction">+</button>`);
  }
}
function daysSince(d){return Math.round((Date.parse(today())-Date.parse(d))/864e5)}
function backupBanner(){
  if(S.sample||!S.txns.length||(S.snooze&&S.snooze>today()))return '';
  const d=S.lastBackup?daysSince(S.lastBackup):null;
  if(d!==null&&d<14)return '';
  return `<div class="banner"><span>${d===null?'You haven’t saved a backup yet.':`Your last backup was ${d} days ago.`}</span><span class="acts"><button data-act="snooze">Later</button><button data-act="backup">Back up</button></span></div>`;
}
function upcoming(a){
  const lim=addPeriod(today(),'monthly');
  const rs=(S.recurring||[]).filter(r=>(r.acct===a.id||r.to===a.id)&&r.next<=lim).sort((x,y)=>x.next<y.next?-1:1).slice(0,3);
  if(!rs.length)return '';
  return `<div class="upcoming"><span class="lbl">Coming up</span>${rs.map(r=>{const amt=r.kind==='in'||(r.kind==='xf'&&r.to===a.id)?r.amount:-r.amount;
    return `<div class="up-item"><span class="when">${longDate(r.next).replace(/, \d{4}$/,'')}</span><span class="name">${esc(ruleName(r))}</span><span class="amt num ${amt<0?'debit':'credit'}">${plain(amt)}</span><button class="chip sm" data-act="postnow" data-id="${r.id}">Add now</button></div>`}).join('')}</div>`;
}
function firstOfMonth(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-01'}

/* ---------- sheets ---------- */
function openSheet(html,name){ui.sheet=name;$('#layer').innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('.sheet [autofocus]');if(f)setTimeout(()=>f.focus(),50)}
function closeSheet(){ui.sheet=null;$('#layer').innerHTML=''}

function sheetTxn(id){
  const t=id?S.txns.find(x=>x.id===id):null;
  const payees=[...new Set(S.txns.map(x=>x.payee).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const cats=[...new Set(S.txns.map(x=>x.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const p=partnerOf(t), rule=ruleOf(t);
  const mode=t?(t.xfer?'xf':(t.amount<0?'out':'in')):'out';
  let from=acct().id,to='';
  if(t&&t.xfer){from=t.amount<0?t.acct:(p?p.acct:t.xfer.other);to=t.amount<0?(p?p.acct:t.xfer.other):t.acct}
  if(!to){const o=S.accounts.find(a=>a.id!==from);to=o?o.id:''}
  const opts=sel=>S.accounts.map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(a.name)}</option>`).join('');
  openSheet(`
    <h2>${t?'Edit transaction':'New transaction'}</h2>
    <form id="txnForm" class="fields" novalidate data-id="${t?t.id:''}">
      <div class="seg" id="seg"><button type="button" class="out${mode==='out'?' on':''}" data-act="seg" data-v="out">Payment</button><button type="button" class="in${mode==='in'?' on':''}" data-act="seg" data-v="in">Deposit</button><button type="button" class="xf${mode==='xf'?' on':''}" data-act="seg" data-v="xf">Transfer</button></div>
      <div id="xfBox" ${mode==='xf'?'':'hidden'}>
        ${S.accounts.length>1?`<div class="xf-row">
          <div class="field"><label for="fFrom">From</label><select id="fFrom">${opts(from)}</select></div>
          <span class="arrow" aria-hidden="true">→</span>
          <div class="field"><label for="fTo">To</label><select id="fTo">${opts(to)}</select></div>
        </div>`:`<p>Transfers need a second account. <button type="button" class="chip" data-act="accounts">Add an account</button></p>`}
      </div>
      <div class="two">
        <div class="field"><label for="fAmt">Amount</label><input id="fAmt" class="num money" inputmode="numeric" autocomplete="off" placeholder="0.00" value="${fmtMoneyInput(t?(Math.abs(t.amount)/100).toFixed(2):'')}" ${t?'':'autofocus'} required></div>
        <div class="field"><label for="fDate">Date</label><input id="fDate" type="date" value="${t?t.date:today()}" required></div>
      </div>
      <div class="field"><label for="fRep">Repeat</label><select id="fRep"><option value="never">Never</option>${Object.entries(FREQ).map(([k,v])=>`<option value="${k}"${rule&&rule.freq===k?' selected':''}>${v}</option>`).join('')}</select>
        ${rule?`<span class="hint">Changes here also apply to future repeats. Past entries stay as they are. Next one: ${longDate(rule.next)}.</span>`:''}</div>
      ${S.accounts.length>1?`<div class="field" id="acctBox" ${mode==='xf'?'hidden':''}><label for="fAcct">Account</label><select id="fAcct">${opts(t?t.acct:acct().id)}</select></div>`:''}
      <div class="field" id="payeeBox" ${mode==='xf'?'hidden':''}><label for="fPayee">Payee</label><input id="fPayee" value="${esc(t?t.payee:'')}" autocomplete="off" autocapitalize="words"><div class="sugg" id="payeeSugg" hidden></div></div>
      <div class="field" id="catBox" ${mode==='xf'?'hidden':''}><label for="fCat">Category</label><input id="fCat" list="cats" value="${esc(t?t.cat:'')}" autocomplete="off"></div>
      <div class="field"><label for="fNote">Note</label><input id="fNote" value="${esc(t?t.note:'')}"></div>
      <label class="check"><input type="checkbox" id="fClr" ${t&&t.cleared?'checked':''}><span>Cleared<small id="clrNote">${mode==='xf'?'Applies to this account’s side. Each account clears on its own.':'It shows on your bank statement'}</small></span></label>
      <datalist id="cats">${cats.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
      <div class="sheet-actions">
        ${t?'<button type="button" class="btn ghost" data-act="deleteOne" style="color:var(--debit)">Delete</button><span class="spacer"></span>':''}
        <button type="button" class="btn ghost" data-act="close">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>`,'txn');
}
function saveTxn(form){
  const amt=Math.round(parseFloat(($('#fAmt').value||'').replace(/[^0-9.]/g,''))*100);
  if(!amt||isNaN(amt)){$('#fAmt').focus();$('#fAmt').style.borderColor='var(--debit)';return}
  const mode=$('#seg .on').dataset.v;
  const id=form.dataset.id;
  let t=id?S.txns.find(x=>x.id===id):null;
  const date=$('#fDate').value||today(), note=$('#fNote').value.trim(), cleared=$('#fClr').checked;
  if(mode==='xf'){
    const fromEl=$('#fFrom'),toEl=$('#fTo');
    if(!fromEl)return;
    const from=fromEl.value,to=toEl.value;
    if(from===to){toEl.style.borderColor='var(--debit)';toEl.focus();return}
    let p=partnerOf(t);
    const here=t?t.acct:acct().id;
    const tSide=here===to?'to':'from';
    if(!t){t={id:uid(),seq:++S.seq};S.txns.push(t)}
    if(!p){p={id:uid(),seq:++S.seq,cleared:false};S.txns.push(p)}
    const link=(t.xfer&&t.xfer.link)||uid();
    const fromRec=tSide==='from'?t:p, toRec=tSide==='from'?p:t;
    Object.assign(fromRec,{acct:from,amount:-amt,date,note,payee:'',cat:'Transfer',xfer:{link,other:to}});
    Object.assign(toRec,{acct:to,amount:amt,date,note,payee:'',cat:'Transfer',xfer:{link,other:from}});
    t.cleared=cleared;
    syncRule(t,$('#fRep').value,{mode,amt,note,from,to});
  }else{
    if(t&&t.xfer){const p=partnerOf(t);if(p)S.txns=S.txns.filter(x=>x!==p);delete t.xfer}
    const target=$('#fAcct')?$('#fAcct').value:(t?t.acct:acct().id);
    const moved=t&&t.acct!==target;
    if(moved)ui.undo=JSON.stringify(S);
    const data={acct:target,date,note,cleared,payee:$('#fPayee').value.trim(),cat:$('#fCat').value.trim(),amount:mode==='out'?-amt:amt};
    if(t)Object.assign(t,data); else {t={id:uid(),seq:++S.seq,...data};S.txns.push(t)}
    remember(data);
    syncRule(t,$('#fRep').value,{mode,amt,note,payee:data.payee,cat:data.cat});
    generateDue();
    if(moved){save();closeSheet();render();toast('Moved to '+acctName(target));return}
    if(!t&&target!==acct().id){save();closeSheet();render();ui.undo=null;toast('Added to '+acctName(target));return}
  }
  generateDue();save();closeSheet();render();
}

function sheetRepeating(){
  const rs=(S.recurring||[]).slice().sort((a,b)=>a.next<b.next?-1:1);
  openSheet(`<h2>Repeating</h2>
    <p>These add themselves to your register, not cleared, on their due date. To set one up, pick a Repeat option when adding a transaction.</p>
    <div class="acct-list">${rs.length?rs.map(r=>`<button class="acct-item" data-act="rule" data-id="${r.id}"><span><b>${esc(ruleName(r))}</b><br><small class="hint">${FREQ[r.freq]} · next ${longDate(r.next)}${r.kind==='xf'?'':' · '+esc(acctName(r.acct))}</small></span><span class="num">${plain(r.kind==='out'||r.kind==='xf'?-r.amount:r.amount)}</span></button>`).join(''):'<p>No repeating transactions yet.</p>'}</div>
    <div class="sheet-actions"><button class="btn" data-act="close">Done</button></div>`,'repeating');
}
function sheetRule(id){
  const r=(S.recurring||[]).find(x=>x.id===id); if(!r)return;
  openSheet(`<h2>${esc(ruleName(r))}</h2>
    <form id="ruleForm" class="fields" novalidate data-id="${r.id}">

function sheetDelete(){

function removeTxns(ids,keepBal,label,newOpeningDate){
  const a=acct(); const set=new Set(ids);
  ui.undo=JSON.stringify(S);
  for(const t of S.txns.filter(x=>set.has(x.id)&&x.xfer)){
    const p=partnerOf(t); if(!p||set.has(p.id))continue;
    if(keepBal){p.payee=label(p);delete p.xfer}   // history trim: the other account keeps its entry
    else set.add(p.id);                            // mistake: remove both sides
  }
  const mine=new Set([...set].filter(id=>{const t=S.txns.find(x=>x.id===id);return t&&t.acct===a.id}));
  const sum=S.txns.filter(t=>mine.has(t.id)).reduce((s,t)=>s+t.amount,0);
  S.txns=S.txns.filter(t=>!set.has(t.id));
  if(keepBal)a.opening+=sum;
  if(newOpeningDate)a.openingDate=newOpeningDate;
  else if(keepBal){const left=txnsOf(a.id); if(left.length&&left[0].date>a.openingDate)a.openingDate=left[0].date}
  save(); ui.sel.clear(); ui.select=false; closeSheet(); render(); toast(label);
}

function toCSV(){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=['Account,Date,Payee,Amount,Category,Cleared,Note,Transfer ID,Rule ID,Repeat,Repeat To,Repeat Day'];
  const live=new Set((S.recurring||[]).map(r=>r.id));
  for(const a of S.accounts){
    lines.push([a.name,a.openingDate,'Opening balance',(a.opening/100).toFixed(2),'','Yes','','','','','',''].map(q).join(','));
    for(const t of txnsOf(a.id))lines.push([a.name,t.date,label(t),(t.amount/100).toFixed(2),t.cat,t.cleared?'Yes':'No',t.note,t.xfer?t.xfer.link:'',live.has(t.rule)?t.rule:'','','',''].map(q).join(','));
  }
  // repeating rules: Date is the next due date, Repeat is how often
  for(const r of S.recurring||[])
    lines.push([acctName(r.acct),r.next,ruleName(r),((r.kind==='in'?1:-1)*r.amount/100).toFixed(2),r.cat||'','',r.note||'','',r.id,FREQ[r.freq],r.kind==='xf'?acctName(r.to):'',r.day||''].map(q).join(','));
  return lines.join('\n');
}

function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function normDate(s){
  s=(s||'').trim(); let m;
  if(m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if(m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(m[1])+'-'+pad(m[2])}
  if(m=s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/)){const mi=MONTHS.findIndex(x=>x.slice(0,3).toLowerCase()===m[1].slice(0,3).toLowerCase());if(mi>=0)return m[3]+'-'+pad(mi+1)+'-'+pad(m[2])}
  if(m=s.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})/)){const mi=MONTHS.findIndex(x=>x.slice(0,3).toLowerCase()===m[2].slice(0,3).toLowerCase());if(mi>=0)return m[3]+'-'+pad(mi+1)+'-'+pad(m[1])}
  const d=new Date(s.replace(/\s+at\s+/i,' '));return isNaN(d)?null:iso(d);
}
const toCents=s=>{s=String(s||'').trim();if(!s)return 0;const neg=/\(.*\d.*\)/.test(s)||/[-−–]\s*\$?\s*\d/.test(s)||/\d\s*[-−]$/.test(s)||/\bDR\b/i.test(s);const n=parseFloat(s.replace(/[^0-9.]/g,''));return isNaN(n)?0:Math.round(n*100)*(neg?-1:1)};
function importCSV(text,replace){
  const rows=parseCSV(text); if(rows.length<2)return 'No rows found. The first line should be column names.';
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>h.findIndex(x=>!x.includes('account')&&names.some(n=>x===n||x.includes(n)));
  const iAcc=h.findIndex(x=>x==='account'||x==='account name'||x==='acct');
  const iD=col('date'), iP=col('payee','description','name','title'), iA=col('amount');
  const iOut=col('withdrawal','debit','payment','expense'), iIn=col('deposit','credit','income');
  const iC=col('category'), iClr=col('cleared','clear','status','reconciled'), iN=col('note','memo'), iX=col('transfer id'), iT=col('type','kind'), iK=col('checknum','check num','check #','check no','check number');
  const iRep=h.indexOf('repeat'), iRepTo=h.indexOf('repeat to'), iRepDay=h.indexOf('repeat day'), iRid=h.indexOf('rule id');
  const ruleMap={}, ruleRefs=[];
  if(iD<0||(iA<0&&iOut<0&&iIn<0))return 'Couldn’t find a date column and an amount column.';
  const before=JSON.stringify(S);
  if(replace)S={v:1,sample:false,seq:0,current:null,accounts:[],txns:[]};
  const made=[];
  const find=name=>{
    name=(name||'').trim()||'Checking';
    let a=S.accounts.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!a){a={id:uid(),name,opening:0,openingDate:today()};S.accounts.push(a);made.push(name)}
    return a;
  };
  const fallback=()=>replace?find('Checking'):acct();
  const links={}, added=[]; let n=0;
  let body=rows.slice(1);
  const ds=body.map(r=>normDate(r[iD])).filter(Boolean);
  if(ds.length>1&&ds[0]>ds[ds.length-1])body=body.reverse(); // newest-first file: add oldest first so same-day order is kept
  for(const r of body){
    const date=normDate(r[iD]); if(!date)continue;
    const a=iAcc>=0?find(r[iAcc]):fallback();
    let amt=iA>=0?toCents(r[iA]):(Math.abs(toCents(r[iIn]))-Math.abs(toCents(r[iOut])));
    const tv=iT>=0?(r[iT]||'').trim().toLowerCase():'';
    if(/expense|payment|withdraw|debit|spend|check|charge|purchase|outflow|bill/.test(tv))amt=-Math.abs(amt);
    else if(/income|deposit|credit|refund|inflow|paycheck|salary/.test(tv))amt=Math.abs(amt);
    const payee=iP>=0?(r[iP]||'').trim():'';
    const repv=iRep>=0?(r[iRep]||'').trim().toLowerCase():'';
    if(repv){ // a repeating rule row
      const freq=Object.keys(FREQ).find(k=>k===repv||FREQ[k].toLowerCase()===repv)||'monthly';
      const toName=iRepTo>=0?(r[iRepTo]||'').trim():'';
      const kind=toName?'xf':(amt<0?'out':'in');
      const rule={id:uid(),kind,acct:a.id,to:toName?find(toName).id:'',amount:Math.abs(amt),payee:kind==='xf'?'':payee,
        cat:kind==='xf'?'Transfer':(iC>=0?(r[iC]||'').trim():''),note:iN>=0?(r[iN]||'').trim():'',freq,
        day:(iRepDay>=0&&+r[iRepDay])||+date.slice(8),next:date};
      S.recurring=S.recurring||[]; S.recurring.push(rule);
      if(iRid>=0&&r[iRid])ruleMap[r[iRid].trim()]=rule.id;
      continue;
    }
    if(/^(opening|initial|starting|beginning) balance$/i.test(payee)){a.opening=amt;a.openingDate=date;continue}
    let cat=iC>=0?(r[iC]||'').trim():''; if(/^(none|uncategorized|-)$/i.test(cat))cat='';
    const chk=iK>=0?(r[iK]||'').trim():'';
    let note=iN>=0?(r[iN]||'').trim():''; if(chk)note=('Check #'+chk+(note?' · '+note:''));
    if(!amt)continue;
    const cv=iClr>=0?(r[iClr]||'').trim().toLowerCase():'';
    const t={id:uid(),acct:a.id,seq:++S.seq,date,payee,amount:amt,cat,note,cleared:['yes','y','true','1','c','cleared','r','reconciled','x'].includes(cv)};
    const xl=iX>=0?(r[iX]||'').trim():'';
    if(xl){(links[xl]=links[xl]||[]).push(t)}
    if(iRid>=0&&(r[iRid]||'').trim())ruleRefs.push([t,r[iRid].trim()]);
    S.txns.push(t); added.push(t); n++; remember(t);
  }
  // re-link transfer pairs
  for(const k in links){const g=links[k];
    if(g.length===2&&g[0].acct!==g[1].acct){const link=uid();
      g[0].xfer={link,other:g[1].acct};g[1].xfer={link,other:g[0].acct};g.forEach(t=>{t.payee='';t.cat=t.cat||'Transfer'})}}
  for(const [t,old] of ruleRefs)if(ruleMap[old])t.rule=ruleMap[old];
  const nr=Object.keys(ruleMap).length; generateDue();
  if(!n&&!S.accounts.length){S=JSON.parse(before);return 'No transactions could be read from that file.'}
  for(const name of made){const a=S.accounts.find(x=>x.name===name);const first=S.txns.filter(t=>t.acct===a.id).reduce((m,t)=>t.date<m?t.date:m,a.openingDate);if(first<a.openingDate)a.openingDate=first}
  if(!S.accounts.some(a=>a.id===S.current))S.current=S.accounts[0].id;
  ui.undo=before; S.sample=false; save(); render();
  const accts=new Set(added.map(t=>t.acct)).size;
  let msg=`Imported ${n} transaction${n===1?'':'s'}${accts>1?` into ${accts} accounts`:''}: ${added.filter(t=>t.amount<0).length} payments, ${added.filter(t=>t.amount>0).length} deposits.`;
  if(nr)msg+=` Restored ${nr} repeating transaction${nr>1?'s':''}.`;
  if(n>2&&added.every(t=>t.amount>0))msg+=' Every amount came in as a deposit, so this file may mark payments in a way I don’t recognize yet.';
  if(made.length&&!replace)msg+=` New account${made.length>1?'s':''}: ${made.join(', ')}.`;
  toast(replace?'Backup restored':'Import finished');
  return msg;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act, id=el.dataset.id, a=acct();
  if(act==='scrim'){if(e.target===el)closeSheet();return}
  switch(act){
    case 'row':
      if(swipe.justMoved){swipe.justMoved=false;return}
      if(swipe.open){closeSwipe();return}
      if(ui.select){ui.sel.has(id)?ui.sel.delete(id):ui.sel.add(id);render()}else sheetTxn(id);break;
    case 'clear':{e.stopPropagation();const t=S.txns.find(x=>x.id===id);t.cleared=!t.cleared;save();render();break}
    case 'add':sheetTxn(null);break;
    case 'swdel':{const t=S.txns.find(x=>x.id===id);if(t){swipe.open=null;removeTxns([t.id],false,'Deleted '+(label(t)||'transaction'))}break}
    case 'select':ui.select=true;ui.sel.clear();render();break;
    case 'done':ui.select=false;ui.sel.clear();render();break;
    case 'all':{const ids=txnsOf(a.id).map(t=>t.id);if(ui.sel.size===ids.length)ui.sel.clear();else ids.forEach(x=>ui.sel.add(x));render();break}
    case 'selcleared':ui.sel.clear();txnsOf(a.id).filter(t=>t.cleared).forEach(t=>ui.sel.add(t.id));render();break;
    case 'selbefore':{const d=$('#beforeDate').value;if(!d)return;ui.sel.clear();txnsOf(a.id).filter(t=>t.date<d).forEach(t=>ui.sel.add(t.id));render();const b=$('#beforeDate');if(b)b.value=d;break}
    case 'askdelete':if(ui.sel.size)sheetDelete();break;
    case 'markclr':{if(!ui.sel.size)return;const v=el.dataset.v==='1';ui.undo=JSON.stringify(S);let n=0;
      for(const t of S.txns)if(ui.sel.has(t.id)){t.cleared=v;n++}
      ui.sel.clear();ui.select=false;save();render();toast(`Marked ${n} ${v?'cleared':'not cleared'}`);break}
    case 'pickPayee':{const p=S.payees[el.dataset.k];if(!p)return;$('#fPayee').value=p.name;
      if(p.cat&&!$('#fCat').value.trim())$('#fCat').value=p.cat;
      const form=$('#txnForm');const cur=$('#seg .on').dataset.v;
      if(!form.dataset.id&&cur!=='xf'){const v=p.out?'out':'in';document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
      $('#payeeSugg').hidden=true;break}
    case 'forgetPayee':{delete S.payees[el.dataset.k];save();showSugg();break}
    case 'dodelete':{const n=ui.sel.size;removeTxns([...ui.sel],$('#keepBal').checked,`Deleted ${n} transaction${n>1?'s':''}`);break}
    case 'deleteOne':{const t=S.txns.find(x=>x.id=== $('#txnForm').dataset.id);removeTxns([t.id],false,'Deleted '+(label(t)||'transaction'));break}
    case 'statement':sheetStatement();break;
    case 'dostatement':{const p=statementPlan();if(!p.remove.length)return;removeTxns(p.remove.map(t=>t.id),true,`New statement from ${longDate(p.d)}`,p.d);break}
    case 'backup':sheetBackup();break;
    case 'savefile':saveFile();break;
    case 'copy':{const ta=$('#csvOut');const done=()=>{el.textContent='Copied';S.lastBackup=today();save()};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ta.focus();ta.select();el.textContent='Text selected, tap Copy'})}else{ta.focus();ta.select()}break}
    case 'import':{const txt=$('#csvIn').value;if(!txt.trim()){$('#impMsg').textContent='Choose a file or paste CSV text first.';return}$('#impMsg').textContent=importCSV(txt,$('#impReplace').checked);break}
    case 'accounts':sheetAccounts();break;
    case 'pick':S.current=id;ui.sel.clear();save();closeSheet();render();break;
    case 'delAcct':{if(el.dataset.armed){S.txns=S.txns.filter(t=>t.acct!==a.id);S.accounts=S.accounts.filter(x=>x.id!==a.id);S.current=S.accounts[0].id;save();closeSheet();render()}else{el.dataset.armed='1';el.textContent='Tap again to delete'}break}
    case 'seg':{const v=el.dataset.v;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
      $('#xfBox').hidden=v!=='xf';$('#payeeBox').hidden=v==='xf';if($('#acctBox'))$('#acctBox').hidden=v==='xf';$('#catBox').hidden=v==='xf';
      $('#clrNote').textContent=v==='xf'?'Applies to this account’s side. Each account clears on its own.':'It shows on your bank statement';break}
    case 'themes':sheetThemes();break;
    case 'settings':sheetSettings();break;
    case 'repeating':sheetRepeating();break;
    case 'rule':sheetRule(id);break;
    case 'stoprule':{if(el.dataset.armed){S.recurring=S.recurring.filter(r=>r.id!==id);save();sheetRepeating();render()}else{el.dataset.armed='1';el.textContent='Tap again to stop'}break}
    case 'postnow':{const r=(S.recurring||[]).find(x=>x.id===id);if(!r)return;ui.undo=JSON.stringify(S);postRule(r,r.next);const d=r.next;r.next=addPeriod(r.next,r.freq,r.day);save();render();toast(`Added ${ruleName(r)} for ${longDate(d)}`);break}
    case 'snooze':{const d=new Date();d.setDate(d.getDate()+3);S.snooze=iso(d);save();render();break}
    case 'opening':sheetOpening();break;
    case 'oseg':document.querySelectorAll('#oSeg button').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'pickTheme':applyTheme(id);try{localStorage.setItem(TKEY,id)}catch(err){}sheetThemes();break;
    case 'close':closeSheet();break;
    case 'undo':if(ui.undo){S=JSON.parse(ui.undo);ui.undo=null;save();render();const t=$('#toast');if(t)t.remove()}break;
    case 'clearSample':S=blankState();save();render();sheetAccounts();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheet)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='txnForm')saveTxn(f);
  if(f.id==='addAcct'){const name=$('#naName').value.trim();if(!name)return;const id=uid();S.accounts.push({id,name,opening:toCents($('#naBal').value),openingDate:today()});S.current=id;S.sample=false;save();closeSheet();render()}
  if(f.id==='ruleForm'){const r=S.recurring.find(x=>x.id===f.dataset.id);if(!r)return;
    const v=Math.abs(toCents($('#rAmt').value));if(v)r.amount=v;
    const nf=$('#rFreq').value;r.freq=nf;const nx=$('#rNext').value;if(nx){r.next=nx;r.day=+nx.slice(8)}
    if($('#rPayee'))r.payee=$('#rPayee').value.trim();
    const n=generateDue();save();render();sheetRepeating();if(n)toast(`Added ${n} repeating entr${n>1?'ies':'y'}`);return}
  if(f.id==='openForm'){const v=Math.abs(toCents($('#oAmt').value));const owed=$('#oSeg .out').classList.contains('on');
    const a=acct();ui.undo=JSON.stringify(S);a.opening=owed?-v:v;a.openingDate=$('#oDate').value||a.openingDate;save();closeSheet();render();toast('Opening balance updated');return}
  if(f.id==='renAcct'){const name=$('#raName').value.trim();if(!name)return;acct().name=name;save();closeSheet();render()}
});
document.addEventListener('focusin',e=>{if(e.target.id==='fPayee')showSugg()});
document.addEventListener('focusout',e=>{if(e.target.id==='fPayee')setTimeout(()=>{const b=$('#payeeSugg');if(b&&document.activeElement!==$('#fPayee'))b.hidden=true},200)});
document.addEventListener('mousedown',e=>{if(e.target.closest('.sugg'))e.preventDefault()});
document.addEventListener('beforeinput',e=>{
  const el=e.target; if(!el.classList||!el.classList.contains('money'))return;
  if(e.inputType==='insertFromPaste'||e.inputType==='insertReplacementText'){
    const txt=e.data||(e.dataTransfer&&e.dataTransfer.getData('text'))||'';
    if(/\d\.\d/.test(txt)){e.preventDefault();el.value=fmtMoneyInput(txt.replace(/[^0-9.]/g,''));caretEnd(el)}
  }
});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('money'))setTimeout(()=>caretEnd(e.target),0)});
document.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('money'))caretEnd(e.target)},true);
document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('money')){const el=e.target;el.value=fmtDigits(el.value);el.style.borderColor='';caretEnd(el);return}
  if(e.target.id==='fPayee')showSugg();if(e.target.id==='stDate'||e.target.id==='stCleared')statementPreview()});
document.addEventListener('change',e=>{
  if(e.target.id==='stCleared')statementPreview();
  if(e.target.id==='stripeToggle'){ui.stripes=e.target.checked;try{localStorage.setItem(TKEY+'-stripes',ui.stripes?'on':'off')}catch(err){}render()}
  if(e.target.id==='csvFile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$('#csvIn').value=r.result;$('#impMsg').textContent='File loaded. Tap Import.'};r.readAsText(e.target.files[0])}
});

/* ---------- swipe left to delete ---------- */
const OPEN=-92;
const swipe={el:null,x0:0,y0:0,dx:0,active:false,open:null,justMoved:false,id:null};
function closeSwipe(){if(swipe.open){swipe.open.style.transform='';swipe.open=null}}
document.addEventListener('pointerdown',e=>{
  if(ui.select||e.button>0)return;
  const row=e.target.closest('.sw .row'); if(!row||e.target.closest('.clr'))return;
  if(swipe.open&&swipe.open!==row)closeSwipe();
  swipe.el=row;swipe.x0=e.clientX;swipe.y0=e.clientY;swipe.dx=0;swipe.active=false;swipe.id=e.pointerId;
  swipe.base=row===swipe.open?OPEN:0;
});
document.addEventListener('pointermove',e=>{
  const r=swipe.el; if(!r||e.pointerId!==swipe.id)return;
  const dx=e.clientX-swipe.x0, dy=e.clientY-swipe.y0;
  if(!swipe.active){
    if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){swipe.el=null;return}
    if(Math.abs(dx)<10)return;
    swipe.active=true;r.classList.add('dragging');try{r.setPointerCapture(e.pointerId)}catch(err){}
  }
  let x=Math.min(0,swipe.base+dx);
  swipe.dx=x; r.style.transform=`translateX(${x}px)`;
});
function endSwipe(e){
  const r=swipe.el; if(!r||e.pointerId!==swipe.id)return; swipe.el=null;
  if(!swipe.active)return;
  r.classList.remove('dragging'); swipe.justMoved=true; setTimeout(()=>{swipe.justMoved=false},350);
  const w=r.offsetWidth;
  if(swipe.dx< -w*0.55){ // full swipe deletes right away
    r.style.transform=`translateX(${-w}px)`;
    const id=r.dataset.id; const t=S.txns.find(x=>x.id===id);
    setTimeout(()=>{swipe.open=null;if(t)removeTxns([t.id],false,'Deleted '+(label(t)||'transaction'))},180);
  }else if(swipe.dx< -50){r.style.transform=`translateX(${OPEN}px)`;swipe.open=r}
  else{r.style.transform='';if(swipe.open===r)swipe.open=null}
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',e=>{const r=swipe.el;if(r&&e.pointerId===swipe.id){r.classList.remove('dragging');if(swipe.open!==r)r.style.transform='';swipe.el=null}});
document.addEventListener('scroll',closeSwipe,{passive:true});

loadTheme(); load(); ensurePayees(); S.recurring=S.recurring||[];
{const n=generateDue();if(n)save();render();if(n){ui.undo=null;toast(`Added ${n} repeating entr${n>1?'ies':'y'} that came due`)}}
})();
</script>
